name: ARI Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Análisis Estático (Quality Gate)
        run: flutter analyze --fatal-infos

      - name: Tests del Orquestador IA (Core)
        run: flutter test test/core/services/ai_service_test.dart

      - name: Tests de Flujo Crítico (Chat UI & E2E)
        run: flutter test test/features/chat/chat_flow_test.dart

      - name: Validación de Compilación Web (CanvasKit)
        run: flutter build web --web-renderer canvaskit

      - name: Simulación de Compilación Android (Release Readiness)
        run: flutter build appbundle --release --dart-define=ENV=qa
