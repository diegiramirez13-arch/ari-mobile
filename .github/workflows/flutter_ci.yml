name: ARI Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Análisis Estático (Freno a código roto)
        run: flutter analyze --fatal-infos

      - name: Tests de Integración y Unitarios
        run: flutter test

      - name: Validación de Compilación Web (CanvasKit)
        run: flutter build web --web-renderer canvaskit
