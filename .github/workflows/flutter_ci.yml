name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Resolve OPENAI key by environment
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY_PROD || secrets.OPENAI_API_KEY }}" >> "$GITHUB_ENV"
            echo "APP_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY_QA || secrets.OPENAI_API_KEY }}" >> "$GITHUB_ENV"
            echo "APP_ENV=qa" >> "$GITHUB_ENV"
          fi

      - name: Detect Flutter platforms in repo
        id: platforms
        shell: bash
        run: |
          [[ -d android ]] && echo "has_android=true" >> "$GITHUB_OUTPUT" || echo "has_android=false" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --dart-define=ENV=${APP_ENV} --dart-define=OPENAI_API_KEY=${OPENAI_API_KEY}

      - name: Build APK (smoke test)
        if: steps.platforms.outputs.has_android == 'true'
        run: flutter build apk --debug --dart-define=ENV=${APP_ENV} --dart-define=OPENAI_API_KEY=${OPENAI_API_KEY}
