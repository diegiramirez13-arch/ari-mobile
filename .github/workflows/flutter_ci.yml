name: Flutter CI

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'

      - run: flutter pub get

      - run: flutter analyze --fatal-infos

      # 👇 CAMBIO CLAVE
      - run: flutter test

      - run: flutter build web --web-renderer canvaskit
